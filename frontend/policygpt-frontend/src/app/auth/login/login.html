<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
  <div class="glass-container" style="width: 100%; max-width: 500px; border-top: 6px solid var(--color-blue);">

    <div style="text-align: center; margin-bottom: 32px;">
      <span style="font-size: 4rem;">🔐</span>
      <h1 style="color: var(--color-blue); margin: 16px 0 8px 0;">Welcome Back</h1>
      <p style="color: var(--color-text-muted); font-size: 1.1rem;">Secure login to PolicyGPT Portal</p>
    </div>

    <!-- Success Message -->
    <div *ngIf="successMessage"
         style="background: rgba(0,200,100,0.15); border: 1px solid var(--color-green); border-radius: 8px;
                padding: 12px 16px; margin-bottom: 20px; color: var(--color-green); font-weight: 500;">
      ✅ {{ successMessage }}
    </div>

    <!-- Error Message -->
    <div *ngIf="errorMessage"
         style="background: rgba(255,50,50,0.12); border: 1px solid #ff4444; border-radius: 8px;
                padding: 12px 16px; margin-bottom: 20px; color: #ff6666; font-weight: 500;">
      ❌ {{ errorMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" style="display: flex; flex-direction: column; gap: 24px;">

      <!-- Email -->
      <div>
        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 500;">
          <i class="material-icons" style="color: var(--color-saffron);">email</i> Email Address
        </label>
        <input
          id="login-email"
          type="email"
          class="fog-input"
          placeholder="citizen@india.gov.in"
          formControlName="email"
        />
        <div *ngIf="email?.invalid && email?.touched"
             style="color: #ff6666; font-size: 0.88rem; margin-top: 4px;">
          Please enter a valid email address.
        </div>
      </div>

      <!-- Password -->
      <div>
        <label style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 500;">
          <i class="material-icons" style="color: var(--color-green);">lock</i> Password
        </label>
        <input
          id="login-password"
          type="password"
          class="fog-input"
          placeholder="Enter your secure password"
          formControlName="password"
        />
        <div *ngIf="password?.invalid && password?.touched"
             style="color: #ff6666; font-size: 0.88rem; margin-top: 4px;">
          Password must be at least 6 characters.
        </div>
      </div>

      <!-- Remember / Forgot -->
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1rem;">
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
          <input type="checkbox" style="width: 18px; height: 18px; cursor: pointer;"> Remember me
        </label>
        <a href="#" style="color: var(--color-blue); text-decoration: none; font-weight: 500;">Forgot Password? 🔑</a>
      </div>

      <!-- Submit -->
      <button
        id="login-submit"
        type="submit"
        class="btn-primary"
        style="margin-top: 16px;"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Sign In <i class="material-icons">arrow_forward</i></span>
        <span *ngIf="isLoading">Signing in... ⏳</span>
      </button>

      <!-- Quick Demo Login Accounts -->
      <div style="background: var(--color-saffron-light); padding: 12px; border-radius: 8px; border: 1px dashed var(--color-saffron); text-align: center;">
        <span style="font-size: 0.85rem; font-weight: 600; color: var(--color-saffron-dark); display: block; margin-bottom: 8px;">
          ⚡ Quick Demo Login (One-click fill):
        </span>
        <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
          <button type="button" (click)="fillDemoAccount('citizen@policygpt.gov.in', 'citizen')" class="fog-input" style="padding: 4px 10px; font-size: 0.8rem; width: auto; cursor: pointer; background: #fff; font-weight: 600;">
            👤 Citizen
          </button>
          <button type="button" (click)="fillDemoAccount('researcher@policygpt.gov.in', 'researcher')" class="fog-input" style="padding: 4px 10px; font-size: 0.8rem; width: auto; cursor: pointer; background: #fff; font-weight: 600;">
            🔬 Researcher
          </button>
          <button type="button" (click)="fillDemoAccount('official@policygpt.gov.in', 'official')" class="fog-input" style="padding: 4px 10px; font-size: 0.8rem; width: auto; cursor: pointer; background: #fff; font-weight: 600;">
            🏛️ Official
          </button>
          <button type="button" (click)="fillDemoAccount('admin@policygpt.gov.in', 'admin')" class="fog-input" style="padding: 4px 10px; font-size: 0.8rem; width: auto; cursor: pointer; background: #fff; font-weight: 600;">
            👑 Admin
          </button>
        </div>
      </div>

      <div style="text-align: center; margin-top: 16px; font-size: 1.1rem;">
        Don't have an account?
        <a routerLink="/register" style="color: var(--color-green); text-decoration: none; font-weight: 500;">
          Create one now ✨
        </a>
      </div>
    </form>
  </div>
</div>
